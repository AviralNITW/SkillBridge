services:
  db:
    image: postgres:16-alpine
    container_name: skillbridge-db
    restart: always
    environment:
      POSTGRES_USER: skillbridge_user
      POSTGRES_PASSWORD: skillbridge_password
      POSTGRES_DB: skillbridge_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillbridge-network

  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skillbridge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://skillbridge_user:skillbridge_password@db:5432/skillbridge_dev?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_for_dev_change_in_prod
    networks:
      - skillbridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillbridge-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    networks:
      - skillbridge-network

networks:
  skillbridge-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
